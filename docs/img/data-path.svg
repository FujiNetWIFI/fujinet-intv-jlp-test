<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <title>Inside a FujiNet INTV cartridge: who serves JLP and the mailbox</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" rx="10" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1c1a1a">Inside the cartridge</text>
  <text x="24" y="60" font-size="13" fill="#555">One RAM array holds JLP RAM and the mailbox. Two CPU cores split the work.</text>

  <!-- console -->
  <rect x="24" y="110" width="130" height="150" rx="8" fill="#eeeeee" stroke="#555"/>
  <text x="89" y="140" font-size="15" font-weight="bold" text-anchor="middle">CP-1610</text>
  <text x="89" y="160" font-size="12" text-anchor="middle">the game</text>
  <text x="89" y="196" font-size="12" text-anchor="middle">reads and writes</text>
  <text x="89" y="212" font-size="12" text-anchor="middle">$8000-$9FFF like</text>
  <text x="89" y="228" font-size="12" text-anchor="middle">any memory</text>

  <!-- cart outline -->
  <rect x="190" y="80" width="470" height="360" rx="12" fill="none" stroke="#1c1a1a" stroke-dasharray="6 4"/>
  <text x="206" y="100" font-size="13" font-weight="bold">RP2040 / RP2350 (cart firmware)</text>

  <!-- core1 -->
  <rect x="210" y="115" width="150" height="150" rx="8" fill="#fff8e1" stroke="#b7791f"/>
  <text x="285" y="140" font-size="15" font-weight="bold" text-anchor="middle">core 1</text>
  <text x="285" y="160" font-size="12" text-anchor="middle">answers every bus</text>
  <text x="285" y="176" font-size="12" text-anchor="middle">cycle in time:</text>
  <text x="285" y="198" font-size="12" text-anchor="middle">ROM, JLP RAM,</text>
  <text x="285" y="214" font-size="12" text-anchor="middle">mailbox cells,</text>
  <text x="285" y="230" font-size="12" text-anchor="middle">CRC-16 (inline)</text>

  <!-- shared RAM -->
  <rect x="210" y="300" width="150" height="120" rx="8" fill="#ffffff" stroke="#1c1a1a"/>
  <rect x="220" y="330" width="130" height="34" fill="#dbe8f7" stroke="#2b6cb0"/>
  <text x="285" y="352" font-size="12" text-anchor="middle">JLP RAM $8040-</text>
  <rect x="220" y="364" width="130" height="24" fill="#f9dfe6" stroke="#d22654"/>
  <text x="285" y="381" font-size="12" text-anchor="middle">mailbox $9C00-</text>
  <rect x="220" y="388" width="130" height="18" fill="#dbe8f7" stroke="#2b6cb0"/>
  <text x="285" y="322" font-size="13" font-weight="bold" text-anchor="middle">cart.RAM[]</text>

  <!-- core0 -->
  <rect x="400" y="115" width="240" height="305" rx="8" fill="#fff8e1" stroke="#b7791f"/>
  <text x="520" y="140" font-size="15" font-weight="bold" text-anchor="middle">core 0</text>
  <rect x="414" y="155" width="212" height="104" rx="6" fill="#dbe8f7" stroke="#2b6cb0"/>
  <text x="520" y="176" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a4f86">JLP requests</text>
  <text x="520" y="195" font-size="12" text-anchor="middle">multiply / divide, random,</text>
  <text x="520" y="211" font-size="12" text-anchor="middle">accelerators on/off, flash</text>
  <text x="520" y="227" font-size="12" text-anchor="middle">(LittleFS file /fl/&lt;game&gt;.save)</text>
  <text x="520" y="248" font-size="11" text-anchor="middle" fill="#555">RP2350: doorbell IRQ. RP2040: polled.</text>
  <rect x="414" y="271" width="212" height="134" rx="6" fill="#f9dfe6" stroke="#d22654"/>
  <text x="520" y="292" font-size="13" font-weight="bold" text-anchor="middle" fill="#8f1235">mailbox service</text>
  <text x="520" y="311" font-size="12" text-anchor="middle">rewrites LINK each pass;</text>
  <text x="520" y="327" font-size="12" text-anchor="middle">SEQ != ACKSEQ starts a</text>
  <text x="520" y="343" font-size="12" text-anchor="middle">transaction, waits up to 5 s,</text>
  <text x="520" y="359" font-size="12" text-anchor="middle">writes the reply, ACKSEQ last</text>
  <text x="520" y="384" font-size="11" text-anchor="middle" fill="#555">only when the mailbox is on</text>

  <!-- esp32 -->
  <rect x="714" y="270" width="170" height="110" rx="8" fill="#eeeeee" stroke="#555"/>
  <text x="799" y="298" font-size="15" font-weight="bold" text-anchor="middle">ESP32-S3</text>
  <text x="799" y="318" font-size="12" text-anchor="middle">FujiNet firmware</text>
  <text x="799" y="336" font-size="12" text-anchor="middle">N:, Fuji $70, clock,</text>
  <text x="799" y="352" font-size="12" text-anchor="middle">AppKeys, ROM push</text>
  <rect x="714" y="130" width="170" height="70" rx="8" fill="#ffffff" stroke="#555"/>
  <text x="799" y="160" font-size="14" font-weight="bold" text-anchor="middle">WiFi</text>
  <text x="799" y="180" font-size="12" text-anchor="middle">HTTP, TNFS, TCP ...</text>

  <g stroke="#1c1a1a" stroke-width="1.5" fill="none">
    <path d="M154,185 L208,185" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <path d="M285,265 L285,298" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <path d="M362,345 L398,345" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <path d="M362,190 C380,190 380,205 412,205" marker-end="url(#ah)"/>
    <path d="M628,330 L712,330" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <path d="M799,268 L799,202" marker-end="url(#ah)" marker-start="url(#ah)"/>
  </g>
  <text x="181" y="178" font-size="11" text-anchor="middle">bus</text>
  <text x="380" y="182" font-size="11" text-anchor="middle">notify</text>
  <text x="687" y="321" font-size="10" text-anchor="middle">USB</text>
  <text x="687" y="345" font-size="10" text-anchor="middle">FujiBus</text>

  <text x="24" y="458" font-size="12" fill="#555">A flash command or a FujiNet transaction keeps core 0 busy; core 1 never stops serving the bus.</text>
</svg>
