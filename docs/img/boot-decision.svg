<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Helvetica, Arial, sans-serif">
  <title>How a FujiNet INTV cart maps a game it boots from the network</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="520" rx="10" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1c1a1a">Who gets $8000-$9FFF at boot</text>
  <text x="24" y="60" font-size="13" fill="#555">fujinet-firmware pico/intellivision apply_boot_mapping(), from the .cfg pushed with the ROM</text>

  <g stroke="#1c1a1a" stroke-width="1.3" fill="none" marker-end="url(#ah)">
    <path d="M430,112 L430,138"/>
    <path d="M330,170 L200,170 L200,212"/>
    <path d="M530,170 L660,170 L660,212"/>
    <path d="M200,272 L200,298"/>
    <path d="M110,330 L110,388"/>
    <path d="M290,330 L290,388"/>
    <path d="M660,272 L660,298"/>
    <path d="M570,330 L570,388"/>
    <path d="M750,330 L750,388"/>
  </g>

  <!-- start -->
  <rect x="300" y="78" width="260" height="34" rx="17" fill="#1c1a1a"/>
  <text x="430" y="100" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">ROM + .cfg pushed by FujiNet</text>

  <!-- q1 -->
  <rect x="330" y="140" width="200" height="60" rx="6" fill="#fff8e1" stroke="#b7791f"/>
  <text x="430" y="166" font-size="14" text-anchor="middle" font-weight="bold">[vars] jlp or jlpflash</text>
  <text x="430" y="185" font-size="14" text-anchor="middle" font-weight="bold">non-zero?</text>
  <text x="262" y="162" font-size="13" text-anchor="middle" fill="#2b6cb0" font-weight="bold">yes: a JLP game</text>
  <text x="598" y="162" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">no</text>

  <!-- q2 jlp -->
  <rect x="100" y="214" width="200" height="58" rx="6" fill="#fff8e1" stroke="#b7791f"/>
  <text x="200" y="239" font-size="14" text-anchor="middle" font-weight="bold">[memattr] RAM under</text>
  <text x="200" y="258" font-size="14" text-anchor="middle" font-weight="bold">$8000-$9FFF?</text>

  <rect x="20" y="300" width="360" height="30" rx="6" fill="#fff8e1" stroke="#b7791f"/>
  <text x="200" y="320" font-size="14" text-anchor="middle" font-weight="bold">no: [vars] fujinet = 1?</text>
  <text x="330" y="246" font-size="13" fill="#9b2c2c" font-weight="bold">yes:</text>
  <text x="330" y="263" font-size="13" fill="#9b2c2c">boot fails, CONFIG</text>
  <text x="330" y="280" font-size="13" fill="#9b2c2c">says JLP CONFLICT</text>

  <!-- jlp outcomes -->
  <rect x="20" y="390" width="180" height="106" rx="8" fill="#dbe8f7" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="110" y="414" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a4f86">no</text>
  <text x="110" y="436" font-size="13" text-anchor="middle">JLP owns all of</text>
  <text x="110" y="453" font-size="13" text-anchor="middle">$8000-$9FFF.</text>
  <text x="110" y="476" font-size="13" text-anchor="middle">Mailbox off.</text>

  <rect x="210" y="390" width="180" height="106" rx="8" fill="#f9dfe6" stroke="#d22654" stroke-width="2.5"/>
  <text x="300" y="414" font-size="14" text-anchor="middle" font-weight="bold" fill="#8f1235">yes</text>
  <text x="300" y="436" font-size="13" text-anchor="middle">JLP window plus the</text>
  <text x="300" y="453" font-size="13" text-anchor="middle">mailbox at $9C00-$9F3F.</text>
  <text x="300" y="476" font-size="13" text-anchor="middle" font-weight="bold">A FujiNet-aware</text>
  <text x="300" y="492" font-size="13" text-anchor="middle" font-weight="bold">JLP game.</text>

  <!-- non-jlp -->
  <rect x="560" y="214" width="200" height="58" rx="6" fill="#fff8e1" stroke="#b7791f"/>
  <text x="660" y="239" font-size="14" text-anchor="middle" font-weight="bold">ROM or RAM inside</text>
  <text x="660" y="258" font-size="14" text-anchor="middle" font-weight="bold">$9C00-$9F3F?</text>
  <rect x="480" y="300" width="360" height="30" rx="6" fill="#ffffff" stroke="#ffffff"/>
  <text x="570" y="320" font-size="13" text-anchor="middle" font-weight="bold">no</text>
  <text x="750" y="320" font-size="13" text-anchor="middle" font-weight="bold">yes</text>

  <rect x="480" y="390" width="180" height="106" rx="8" fill="#f9dfe6" stroke="#d22654" stroke-width="1.5"/>
  <text x="570" y="420" font-size="13" text-anchor="middle">No JLP. The mailbox</text>
  <text x="570" y="437" font-size="13" text-anchor="middle">alone at $9C00-$9F3F.</text>
  <text x="570" y="460" font-size="13" text-anchor="middle">Most FujiNet games.</text>

  <rect x="670" y="390" width="170" height="106" rx="8" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <text x="755" y="420" font-size="13" text-anchor="middle">Mailbox off; the</text>
  <text x="755" y="437" font-size="13" text-anchor="middle">game's own ROM or</text>
  <text x="755" y="454" font-size="13" text-anchor="middle">RAM answers there.</text>
  <text x="755" y="477" font-size="13" text-anchor="middle">Old carts.</text>

  <text x="430" y="514" font-size="12" fill="#555" text-anchor="middle">An Intellicart .rom carries no [vars] the cart reads: over the network it never gets JLP. Ship .bin + .cfg.</text>
</svg>
